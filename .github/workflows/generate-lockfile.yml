name: Generate package-lock.json

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate package-lock.json from package.json
        run: |
          rm -f package-lock.json
          npm install

      - name: Verify npm ci now works with the regenerated lock file
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Commit regenerated package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --staged --quiet; then
            echo "No changes to package-lock.json — nothing to commit."
          else
            git commit -m "chore: regenerate package-lock.json for World Explorer deps"
            git push
          fi
