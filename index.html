<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F1E7" />
    <meta name="description" content="Cellfie — a calm, offline-first scientific learning companion." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores the web manifest's icon list entirely for "Add to
         Home Screen" and only ever looks for this link tag, so without
         it an iOS install falls back to a screenshot-of-the-page icon
         (and, on some versions, a less reliable standalone launch). -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Literata:wght@400;500&family=Karla:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <title>Cellfie</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Single Page Apps for GitHub Pages — decodes the redirect encoded
      // by public/404.html back into a normal path via the History API,
      // before React Router mounts. See 404.html for the full explanation.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (segment) {
              return segment.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
